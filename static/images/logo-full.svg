<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- Free Food Full Logo: Symbol + Brand Typography -->
  <defs>
    <linearGradient id="sqGradFull" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#58081E"/>
      <stop offset="100%" stop-color="#3B0313"/>
    </linearGradient>

    <radialGradient id="hearthGlowFull" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="steamRibbonLFull" x1="10%" y1="90%" x2="70%" y2="10%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <linearGradient id="steamRibbonRFull" x1="90%" y1="90%" x2="30%" y2="10%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <linearGradient id="flameCoreFull" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FEF08A"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="bowlShellGradFull" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="40%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <linearGradient id="soupGradFull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <linearGradient id="foodTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <filter id="softShadowFull" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left: Symbol Mark (scaled to 54px) -->
  <g transform="translate(5, 5) scale(0.54)">
    <rect x="3" y="3" width="94" height="94" rx="25" fill="url(#sqGradFull)" filter="url(#softShadowFull)"/>
    <rect x="3.5" y="3.5" width="93" height="93" rx="24.5" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="50" cy="42" r="32" fill="url(#hearthGlowFull)"/>

    <path d="M 49.5 53 C 47.5 45, 36 43, 34 32 C 32 20.5, 45 15, 50 25 C 46 20, 38.5 22, 38.5 30 C 38.5 39, 47.5 45, 49.5 53 Z" 
          fill="url(#steamRibbonLFull)" opacity="0.95"/>
    <path d="M 50.5 53 C 52.5 45, 64 43, 66 32 C 68 20.5, 55 15, 50 25 C 54 20, 61.5 22, 61.5 30 C 61.5 39, 52.5 45, 50.5 53 Z" 
          fill="url(#steamRibbonRFull)" opacity="0.95"/>
    <path d="M 50 26 C 48 21.5, 43 21.5, 43 27 C 43 32.5, 50 37.5, 50 37.5 C 50 37.5, 57 32.5, 57 27 C 57 21.5, 52 21.5, 50 26 Z" 
          fill="url(#flameCoreFull)" opacity="0.88"/>

    <path d="M 19 55.5 C 19 74, 32.5 82.5, 50 82.5 C 67.5 82.5, 81 74, 81 55.5 Z" 
          fill="url(#bowlShellGradFull)"/>
    <path d="M 39 82.5 C 39 86, 43 87, 50 87 C 57 87, 61 86, 61 82.5 Z" 
          fill="#9F1239"/>
    <ellipse cx="50" cy="55.5" rx="31" ry="8" fill="#F97316"/>
    <ellipse cx="50" cy="56" rx="27" ry="5.8" fill="url(#soupGradFull)"/>
    <ellipse cx="50" cy="56.3" rx="22" ry="3.5" fill="#FEF08A" opacity="0.5"/>
    <path d="M 24 61 C 22.5 69, 28 75.5, 36 78.5" 
          stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Right: Modern Brand Typography "Free Food" -->
  <text x="68" y="42" 
        font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="29" 
        letter-spacing="-0.035em"
        fill="#0F172A">Free <tspan fill="url(#foodTextGrad)">Food</tspan></text>
</svg>
