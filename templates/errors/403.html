{% extends 'base.html' %}

{% block title %}Access Restricted (403) — Free Food{% endblock %}

{% block content %}
<div class="container" style="padding-top: 3.5rem; padding-bottom: 4rem; display: flex; justify-content: center;">
  <div style="background: #ffffff; border: 1px solid var(--border-color); border-radius: var(--radius-modal); padding: 3rem 2rem; max-width: 480px; width: 100%; text-align: center; box-shadow: var(--shadow-card);">
    <div style="width: 72px; height: 72px; border-radius: 50%; background: #fee2e2; color: #dc2626; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <span class="badge badge-danger" style="margin-bottom: 0.75rem;">Error 403</span>
    <h1 style="font-size: 1.75rem; font-weight: 800; color: #111827; margin-bottom: 0.5rem; letter-spacing: -0.02em;">Access Restricted</h1>
    <p style="color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 2rem;">
      {{ message|default:"You don't have authorization to access this area. Staff or moderator privileges are required." }}
    </p>
    <a href="{% url 'food:home' %}" class="btn btn-primary" style="justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Return to Home
    </a>
  </div>
</div>
{% endblock %}
