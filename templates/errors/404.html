{% extends 'base.html' %}

{% block title %}Page Not Found (404) — Dona.Com{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 1.25rem; text-align: center;">
  <div style="font-size: 1.5rem; font-weight: 800; color: #dc2626; margin-bottom: 0.5rem;">Resource Missing</div>
  <h1 style="font-size: 2rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem;">404 — Page Not Found</h1>
  <p style="color: #64748b; max-width: 500px; margin: 0 auto 2rem; font-size: 1rem;">
    The page or free food event you are looking for does not exist, has expired, or is pending verification.
  </p>
  <div style="display: flex; justify-content: center; gap: 1rem;">
    <a href="{% url 'food:home' %}" class="btn btn-primary">Go to Home</a>
    <a href="{% url 'food:event_list' %}" class="btn btn-secondary">Browse All Events</a>
  </div>
</div>
{% endblock %}
