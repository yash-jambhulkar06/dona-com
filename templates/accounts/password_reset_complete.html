{% extends 'base.html' %}

{% block title %}Password Changed — Dona.Com{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-card-wrap">
    <div class="auth-card">
      <div style="font-size: 2.5rem; color: #16a34a; margin-bottom: 0.75rem;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto; display: block;">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M8 12l2 2 4-4"></path>
        </svg>
      </div>

      <h1 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem;">
        Password Changed Successfully!
      </h1>
      <p style="color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.75rem;">
        Your password has been securely updated. You can now sign in with your new credentials.
      </p>

      <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block" style="padding: 0.75rem 1rem; font-size: 1rem;">
        Sign In Now
      </a>
    </div>
  </div>
</div>
{% endblock %}
