{% extends 'base.html' %}

{% block title %}Password Changed — Free Food{% endblock %}

{% block content %}
<div class="container auth-shell">
  <div class="auth-card-shell">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="width: 48px; height: 48px; border-radius: 50%; background: #dcfce7; color: #16a34a; display: flex; align-items: center; justify-content: center; margin: 0 auto 0.75rem auto;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <div class="auth-brand" style="justify-content: center; margin-bottom: 0.25rem;">Free <span style="color: var(--primary);">Food</span></div>
        <h1 class="auth-title">Password Changed!</h1>
        <p class="auth-subtitle">Your password has been securely updated. You can now sign in with your new credentials.</p>
      </div>

      <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block btn-lg">
        Sign In Now
      </a>
    </div>
  </div>
</div>
{% endblock %}
